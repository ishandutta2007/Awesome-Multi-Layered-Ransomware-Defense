 5s ease-in-out infinite}.pill-2{animation:floatPillAlt 6s ease-in-out infinite}.pill-3{animation:floatPill 5.5s ease-in-out infinite 1s}.pill-4{animation:floatPillAlt 6.5s ease-in-out infinite .5s}.grid-line{stroke:#1e293b;stroke-width:1;stroke-opacity:.4}.stream-line{stroke-dasharray:8 12;animation:dashMove 2s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g opacity=".6"><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="300" y2="300" class="grid-line"/><line x1="100" x2="100" y1="0" y2="360" class="grid-line"/><line x1="250" x2="250" y1="0" y2="360" class="grid-line"/><line x1="400" x2="400" y1="0" y2="360" class="grid-line"/><line x1="550" x2="550" y1="0" y2="360" class="grid-line"/><line x1="700" x2="700" y1="0" y2="360" class="grid-line"/><line x1="850" x2="850" y1="0" y2="360" class="grid-line"/></g><g opacity=".35"><path fill="none" stroke="#00f2fe" stroke-width="1.5" d="M 0 100 Q 300 40 600 110 T 1200 80" class="stream-line"/><path fill="none" stroke="#38ef7d" stroke-width="1.5" d="M 0 280 Q 400 320 800 250 T 1200 270" class="stream-line" style="animation-direction:reverse"/></g><circle cx="1040" cy="180" r="160" fill="#00f2fe" filter="url(#glow)" opacity=".08"/><circle cx="200" cy="80" r="120" fill="#38ef7d" filter="url(#glow)" opacity=".05"/><g id="defense-radar"><g class="orbit-ring"><circle cx="1040" cy="180" r="125" fill="none" stroke="#0284c7" stroke-dasharray="6 8" stroke-width="1" opacity=".6"/><circle cx="1165" cy="180" r="5" fill="#38ef7d" filter="url(#softGlow)"/><circle cx="915" cy="180" r="4" fill="#00f2fe" filter="url(#softGlow)"/><circle cx="1040" cy="55" r="4" fill="#38bdf8" filter="url(#softGlow)"/><circle cx="1040" cy="305" r="5" fill="#f43f5e" filter="url(#softGlow)"/></g><g class="orbit-ri