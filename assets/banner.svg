<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.05); }
    }
    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillAlt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orbit-ring {
      transform-origin: 1040px 180px;
      animation: orbitRotate 24s linear infinite;
    }
    .orbit-ring-rev {
      transform-origin: 1040px 180px;
      animation: orbitRotate 18s linear infinite reverse;
    }
    .radar-sweep {
      transform-origin: 1040px 180px;
      animation: radarSweep 8s linear infinite;
    }
    .pulsing-shield {
      transform-origin: 1040px 180px;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillAlt 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPillAlt 6.5s ease-in-out infinite 0.5s; }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.4; }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dashMove 2s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.6">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="360" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="360" class="grid-line" />
  </g>

  <!-- Data Flow Streams (Animated Network Paths) -->
  <g opacity="0.35">
    <path d="M 0 100 Q 300 40 600 110 T 1200 80" fill="none" stroke="#00f2fe" stroke-width="1.5" class="stream-line" />
    <path d="M 0 280 Q 400 320 800 250 T 1200 270" fill="none" stroke="#38ef7d" stroke-width="1.5" class="stream-line" style="animation-direction: reverse;" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="1040" cy="180" r="160" fill="#00f2fe" opacity="0.08" filter="url(#glow)" />
  <circle cx="200" cy="80" r="120" fill="#38ef7d" opacity="0.05" filter="url(#glow)" />

  <!-- DYNAMIC RIGHT GRAPHIC: Cyber Defense Radar & Multi-Layer Shield -->
  <g id="defense-radar">
    <!-- Outer Orbiting Ring with Decoy Nodes -->
    <g class="orbit-ring">
      <circle cx="1040" cy="180" r="125" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="6 8" opacity="0.6" />
      <circle cx="1165" cy="180" r="5" fill="#38ef7d" filter="url(#softGlow)" />
      <circle cx="915" cy="180" r="4" fill="#00f2fe" filter="url(#softGlow)" />
      <circle cx="1040" cy="55" r="4" fill="#38bdf8" filter="url(#softGlow)" />
      <circle cx="1040" cy="305" r="5" fill="#f43f5e" filter="url(#softGlow)" />
    </g>

    <!-- Mid Orbit Ring (Counter-rotating) -->
    <g class="orbit-ring-rev">
      <circle cx="1040" cy="180" r="95" fill="none" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.7" />
      <circle cx="1135" cy="180" r="4" fill="#00f2fe" />
      <circle cx="945" cy="180" r="4" fill="#38ef7d" />
    </g>

    <!-- Radar Sweep Beam -->
    <g class="radar-sweep" opacity="0.25">
      <path d="M 1040 180 L 1140 130 A 110 110 0 0 1 1140 230 Z" fill="url(#shieldGrad)" />
    </g>

    <!-- Innermost Concentric Security Ring -->
    <circle cx="1040" cy="180" r="65" fill="#0f172a" stroke="#00f2fe" stroke-width="2" opacity="0.85" filter="url(#softGlow)" />

    <!-- Pulsing Multi-Layer Shield Center Icon -->
    <g class="pulsing-shield">
      <path d="M 1040 145 
               Q 1065 150 1072 165 
               Q 1072 195 1040 215 
               Q 1008 195 1008 165 
               Q 1015 150 1040 145 Z" 
            fill="url(#accentGrad)" opacity="0.9" filter="url(#softGlow)" />
      <!-- Inner Shield Core / Checkmark -->
      <path d="M 1030 180 L 1037 187 L 1052 172" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- FOREGROUND: Clean, High-Contrast Typography & Pillars -->
  <!-- Top Badge / Pill -->
  <g class="pill-1">
    <rect x="70" y="45" width="220" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <circle cx="85" cy="59" r="4" fill="#38ef7d" filter="url(#softGlow)" />
    <text x="98" y="64" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ENTERPRISE RESILIENCE</text>
  </g>

  <!-- Main Headline -->
  <text x="70" y="118" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    MULTI-LAYERED RANSOMWARE DEFENSE
  </text>

  <!-- Subtitle Line 1 & Line 2 -->
  <text x="70" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">
    Curated architectures, autonomous EDR engines, immutable recovery vaults, and canary telemetry.
  </text>
  <text x="70" y="174" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">
    Comprehensive industry intelligence covering enterprise SaaS suites &amp; battle-hardened open-source software.
  </text>

  <!-- Floating Feature / Architecture Cards (Foreground Badges) -->
  <g class="pill-1">
    <rect x="70" y="215" width="160" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="90" cy="236" r="6" fill="#38bdf8" />
    <text x="105" y="233" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Layer 1: Pre-Execution</text>
    <text x="105" y="247" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">NGAV, YARA &amp; PE ML</text>
  </g>

  <g class="pill-2">
    <rect x="245" y="215" width="165" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="265" cy="236" r="6" fill="#00f2fe" />
    <text x="280" y="233" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Layer 2: Active Burst</text>
    <text x="280" y="247" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">eBPF LSM &amp; Fanotify</text>
  </g>

  <g class="pill-3">
    <rect x="425" y="215" width="165" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="445" cy="236" r="6" fill="#38ef7d" />
    <text x="460" y="233" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Layer 3: Tripwires</text>
    <text x="460" y="247" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">Canary Files &amp; Traps</text>
  </g>

  <g class="pill-4">
    <rect x="605" y="215" width="170" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="625" cy="236" r="6" fill="#a855f7" />
    <text x="640" y="233" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Layer 4: Immutable Vault</text>
    <text x="640" y="247" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10">Air-Gapped Snapshots</text>
  </g>

  <!-- Bottom Interactive Tech Specs Footer -->
  <g opacity="0.85">
    <text x="70" y="305" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      DEFENSIVE VECTORS: <tspan fill="#94a3b8">Volume Shadow Protection</tspan> • <tspan fill="#94a3b8">Entropy Spike Halting</tspan> • <tspan fill="#94a3b8">Kernel Minifilters</tspan> • <tspan fill="#94a3b8">Continuous Backup Verification</tspan>
    </text>
  </g>

  <!-- Accent Border Glow -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3" />
</svg>
